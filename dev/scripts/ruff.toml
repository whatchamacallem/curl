line-length = 79
indent-width = 4
target-version = "py311"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# F821 is off because a settings declaration is a bare annotation --
# "_RANKING_COUNTER_NAME: str" with no value -- which ruff reads as a use of
# an undefined name. settings.load_into() is what binds it, at import, and
# it is deliberate that the name is unbound until then: that is how the
# reader knows the SCREAMING_SNAKE namespace it walks holds only settings it
# was asked for. pyright understands the form and still reports a genuinely
# undefined name, so the check moved tools rather than being dropped -- it
# is one of the things reformat.sh's 0-error pyright gate is covering.
# E401 and I001 are off because every module is imported plainly, packed
# onto one alphabetical line per block -- one before the sys.path.insert()
# and one after it for our own modules. Both rules would unpack those lines
# back to one import each, and reformat.sh runs ruff with --fix, so leaving
# them on would silently undo the shape on the next format run. Three forms
# of "from X import Y" are allowed: "from __future__ import annotations",
# and the names taken from collections.abc and from typing, whose lines sit
# below the first plain line with their names spelled alphabetically. No
# other module may be imported that way.
ignore = ["E401", "E501", "F821", "I001"]
