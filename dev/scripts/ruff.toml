line-length = 79
indent-width = 4
target-version = "py311"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# F821 is off because a settings declaration is a bare annotation --
# "_RANKING_COUNTER_NAME: str" with no value -- which ruff reads as a use of
# an undefined name. settings.load_into() is what binds it, at import, and
# it is deliberate that the name is unbound until then: that is how the
# reader knows the SCREAMING_SNAKE namespace it walks holds only settings it
# was asked for. pyright understands the form and still reports a genuinely
# undefined name, so the check moved tools rather than being dropped -- it
# is one of the things reformat.sh's 0-error pyright gate is covering.
# E401 and I001 are off because every module is imported plainly -- there is
# no "from X import Y" anywhere but "from __future__ import annotations" --
# and the plain imports are packed onto one alphabetical line per block, one
# before the sys.path.insert() and one after it. Both rules would unpack
# those lines back to one import each, and reformat.sh runs ruff with --fix,
# so leaving them on would silently undo the shape on the next format run.
ignore = ["E401", "E501", "F821", "I001"]
