<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="../scripts/error_overlay.js"></script>
    <script src="../scripts/utility.js"></script>
    <script src="../scripts/ui_strings.js"></script>
    <script src="../scripts/settings.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="../scripts/theme.css" />
    <link rel="stylesheet" href="../scripts/heat_map.css" />
    <link rel="stylesheet" href="../scripts/light_mode.css" />
    <link rel="stylesheet" href="../scripts/dark_mode.css" />
  </head>
  <body id="heat-map-">
    <div id="heat-map-tree-" role="tree"></div>
    <div
      id="heat-map-tree-scrollbar-"
      class="text-scrollbar- vertical-"
      data-scrolls-="heat-map-tree-"
    ></div>
    <section id="heat-map-main-" tabindex="0"></section>
    <div id="heat-map-minimap-" class="empty-" aria-hidden="true">
      <div id="heat-map-minimap-box-"></div>
      <div id="heat-map-minimap-viewport-" hidden></div>
    </div>
    <div
      id="heat-map-main-scrollbar-"
      class="text-scrollbar- vertical-"
      data-scrolls-="heat-map-main-"
      aria-hidden="true"
    ></div>
    <template id="heat-map-main-template-">__HEAT_MAP_MAIN__</template>
    <script src="../scripts/pulldown_text.js"></script>
    <template id="page-held-script-">
      <script src="../scripts/debug.js"></script>
      <script src="../scripts/theme.js"></script>
      <script src="../scripts/preferences.js"></script>
      <script src="../scripts/heat_map.js"></script>
    </template>
