<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>test index</title>
    <script src="scripts/error_overlay.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #202020;
        color: #e0e0e0;
        font-family: monospace;
      }
      a {
        color: #89cff0;
      }
      #strip- {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 4px;
        background: inherit;
      }
      #strip- select,
      #strip- input,
      #strip- button {
        font: inherit;
      }
      #strip- form {
        display: inline;
      }
      #grid- table {
        width: 100%;
        border: 0;
        border-spacing: 0;
        border-collapse: collapse;
        table-layout: fixed;
      }
      #grid- td {
        padding: 0;
        border: 0;
        overflow: hidden;
      }
      .cell- {
        position: relative;
        overflow: hidden;
      }
      .cell- iframe {
        position: absolute;
        left: 0;
        top: 0;
        border: 0;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .cell- a {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
      }
      #page-timings- {
        border-collapse: collapse;
      }
      #page-timings- th,
      #page-timings- td {
        padding: 0 1ch;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="strip-">
      perf2html <span id="report-links-"></span>
      <a href="test_verbose.md">test_verbose.md</a>
      <label for="width-">width:</label>
      <select id="width-" autocomplete="off"></select>
      <form id="window-form-">
        <label for="resolution-">resolution:</label>
        <input
          id="resolution-"
          type="number"
          min="1"
          step="1"
          required
          autocomplete="off"
        />p
        <label for="zoom-">zoom:</label>
        <input
          id="zoom-"
          type="number"
          min="1"
          step="1"
          required
          autocomplete="off"
        />%
        <button type="submit">apply</button>
      </form>
    </div>
    <div id="grid-"></div>
    <table id="page-timings-">
      <thead>
        <tr>
          <th>ms</th>
          <th>page</th>
          <th>phase</th>
          <th>shot</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    __SHOT_LIST__
    <script>
      (function () {
        const data = JSON.parse(
          document.getElementById("shot-list-").textContent,
        );
        const select = document.getElementById("width-");
        const resolution_box = document.getElementById("resolution-");
        const zoom_box = document.getElementById("zoom-");
        const window_form = document.getElementById("window-form-");
        const grid = document.getElementById("grid-");
        const report_links = document.getElementById("report-links-");
        const timing_table = document.getElementById("page-timings-");
        const RESOLUTION_HASH_KEY = "resolution";
        // The page y of the menu and view boundary, kept on whole pixels.
        const SCALE_QUANTUM_PAGE_Y = 51;
        const WIDTH_CHOICE_MAX = 16;
        const WIDTH_DEFAULT = 4;
        const WIDTH_STORAGE_KEY = "perf2html.test.thumbs_width";
        const ZOOM_HASH_KEY = "zoom";
        // The zoom percent of no zoom, which a frame takes when none is given.
        const ZOOM_WHOLE_PERCENT = 100;
        let frame_height = 0,
          frame_width = 0,
          frame_zoom = 0,
          layout_animation_frame = 0;
        for (let n = 1; n <= WIDTH_CHOICE_MAX; n++) {
          const option = document.createElement("option");
          option.value = String(n);
          option.textContent = String(n);
          select.appendChild(option);
        }
        select.value = width_choice_read();
        data.reports.forEach(function (report_entry, report_index) {
          if (report_index > 0) {
            report_links.append(" ");
          }
          const report_link = document.createElement("a");
          report_link.href = report_entry.href;
          report_link.textContent = report_entry.name;
          report_links.append(report_link);
        });
        // Draws every report's page load and phase timings, slowest first.
        data.page_timings.sort(function (first_timing, second_timing) {
          return (
            Number(second_timing.duration_ms) -
            Number(first_timing.duration_ms)
          );
        });
        for (const page_timing of data.page_timings) {
          const timing_row = timing_table.tBodies[0].insertRow();
          for (const column_text of [
            page_timing.duration_ms,
            page_timing.page_file,
            page_timing.phase_label,
            page_timing.shot,
          ]) {
            timing_row.insertCell().textContent = column_text;
          }
        }

        // Returns the stored width choice, the default when none is stored.
        function width_choice_read() {
          const stored_choice = localStorage.getItem(WIDTH_STORAGE_KEY);
          if (stored_choice === null) {
            return String(WIDTH_DEFAULT);
          }
          const width_choices = Array.from(select.options, function (option) {
            return option.value;
          });
          if (!width_choices.includes(stored_choice)) {
            throw new Error(WIDTH_STORAGE_KEY + " holds " + stored_choice);
          }
          return stored_choice;
        }

        function width_choice_write() {
          localStorage.setItem(WIDTH_STORAGE_KEY, select.value);
        }

        // Returns a hash key's whole number above zero, null for none.
        function hash_number_read(hash_key) {
          const number_text = new URLSearchParams(location.hash.slice(1)).get(
            hash_key,
          );
          if (number_text === null) {
            return null;
          }
          if (!/^[1-9][0-9]*$/.test(number_text)) {
            throw new Error(hash_key + " holds " + number_text);
          }
          return Number(number_text);
        }

        // Returns the hash holding a resolution and a zoom percent.
        function window_hash(resolution, zoom_percent) {
          return (
            "#" +
            new URLSearchParams({
              [RESOLUTION_HASH_KEY]: resolution,
              [ZOOM_HASH_KEY]: zoom_percent,
            })
          );
        }

        // Sizes every frame to a resolution in the shots' aspect, zoomed.
        function window_apply(resolution, zoom_percent) {
          frame_height = resolution;
          frame_width = Math.round((resolution * data.width) / data.height);
          frame_zoom = zoom_percent / ZOOM_WHOLE_PERCENT;
          resolution_box.value = String(resolution);
          zoom_box.value = String(zoom_percent);
          build();
        }

        // Applies the hash's window, writing in each default it lacks.
        function hash_window_take() {
          const hash_resolution = hash_number_read(RESOLUTION_HASH_KEY);
          const hash_zoom_percent = hash_number_read(ZOOM_HASH_KEY);
          if (hash_resolution === null || hash_zoom_percent === null) {
            history.replaceState(
              null,
              "",
              window_hash(
                hash_resolution === null ? data.height : hash_resolution,
                hash_zoom_percent === null
                  ? ZOOM_WHOLE_PERCENT
                  : hash_zoom_percent,
              ),
            );
          }
          window_apply(
            hash_number_read(RESOLUTION_HASH_KEY),
            hash_number_read(ZOOM_HASH_KEY),
          );
        }

        // Sizes whole pixel boxes under a scale quantized for whole rows.
        function layout() {
          const count = Number(select.value);
          const cell_width = grid.clientWidth / count;
          const scale =
            Math.floor((cell_width / frame_width) * SCALE_QUANTUM_PAGE_Y) /
            SCALE_QUANTUM_PAGE_Y;
          const box_width = Math.floor(frame_width * scale);
          const box_height = Math.floor(frame_height * scale);
          for (const cell of grid.querySelectorAll(".cell-")) {
            cell.style.width = box_width + "px";
            cell.style.height = box_height + "px";
            cell.firstChild.style.transform = "scale(" + scale + ")";
          }
        }

        // Lays out next frame, so no observed size changes in the callback.
        function layout_defer() {
          if (!layout_animation_frame) {
            layout_animation_frame = requestAnimationFrame(function () {
              layout_animation_frame = 0;
              layout();
            });
          }
        }

        function build() {
          const count = Number(select.value);
          const table = document.createElement("table");
          let row = null;
          data.pages.forEach(function (page, index) {
            if (index % count === 0) {
              row = table.insertRow();
            }
            const cell = row.insertCell();
            cell.style.width = 100 / count + "%";
            const box = document.createElement("div");
            box.className = "cell-";
            const frame = document.createElement("iframe");
            frame.src = page.href;
            // Shows the page the window a browser zoom gives, in the same box.
            frame.style.width = frame_width / frame_zoom + "px";
            frame.style.height = frame_height / frame_zoom + "px";
            frame.style.zoom = String(frame_zoom);
            // Opens the page as a user loads it, with no screenshot code.
            const page_address = new URL(page.href, document.baseURI);
            for (const screenshot_key of data.screenshot_keys) {
              page_address.searchParams.delete(screenshot_key);
            }
            const link = document.createElement("a");
            link.href = page_address.href;
            link.setAttribute("aria-label", page.name);
            box.appendChild(frame);
            box.appendChild(link);
            cell.appendChild(box);
          });
          while (row.cells.length < count) {
            row.insertCell();
          }
          grid.replaceChildren(table);
          layout();
        }

        select.addEventListener("change", function () {
          width_choice_write();
          build();
        });
        // Puts the edited window in the hash, which applies it.
        window_form.addEventListener("submit", function (submit_event) {
          submit_event.preventDefault();
          location.hash = window_hash(
            Number(resolution_box.value),
            Number(zoom_box.value),
          );
        });
        window.addEventListener("hashchange", hash_window_take);
        new ResizeObserver(layout_defer).observe(grid);
        // Takes the focus from the frames, each of which may have focused one.
        window.addEventListener("load", function () {
          window.focus();
        });
        hash_window_take();
      })();
    </script>
  </body>
</html>
