<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>test index</title>
    <style>
      html,
      body {
        margin: 0;
        background: #202020;
        color: #e0e0e0;
        font-family: monospace;
      }
      a {
        color: #89cff0;
      }
      #strip- {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 4px;
        background: inherit;
      }
      #strip- select {
        font: inherit;
      }
      table {
        width: 100%;
        border: 0;
        border-spacing: 0;
        border-collapse: collapse;
        table-layout: fixed;
      }
      td {
        padding: 0;
        border: 0;
        overflow: hidden;
      }
      .cell- {
        position: relative;
        overflow: hidden;
      }
      .cell- iframe {
        position: absolute;
        left: 0;
        top: 0;
        border: 0;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .cell- a {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div id="strip-">
      perf2html <span id="report-links-"></span>
      <label for="width-">width:</label>
      <select id="width-" autocomplete="off"></select>
    </div>
    <div id="grid-"></div>
    __SHOT_LIST__
    <script>
      (function () {
        const data = JSON.parse(
          document.getElementById("shot-list-").textContent,
        );
        const select = document.getElementById("width-");
        const grid = document.getElementById("grid-");
        const report_links = document.getElementById("report-links-");
        const WIDTH_CHOICE_MAX = 16;
        const WIDTH_DEFAULT = 4;
        const WIDTH_STORAGE_KEY = "perf2html.test.thumbs_width";
        for (let n = 1; n <= WIDTH_CHOICE_MAX; n++) {
          const option = document.createElement("option");
          option.value = String(n);
          option.textContent = String(n);
          select.appendChild(option);
        }
        select.value = width_choice_read();
        data.reports.forEach(function (report_entry, report_index) {
          if (report_index > 0) {
            report_links.append(" ");
          }
          const report_link = document.createElement("a");
          report_link.href = report_entry.href;
          report_link.textContent = report_entry.name;
          report_links.append(report_link);
        });

        // Answers the stored width choice, the default when none is stored.
        function width_choice_read() {
          let stored_choice = null;
          try {
            stored_choice = localStorage.getItem(WIDTH_STORAGE_KEY);
          } catch (storage_error) {}
          if (stored_choice === null) {
            return String(WIDTH_DEFAULT);
          }
          const width_choices = Array.from(select.options, function (option) {
            return option.value;
          });
          if (!width_choices.includes(stored_choice)) {
            throw new Error(WIDTH_STORAGE_KEY + " holds " + stored_choice);
          }
          return stored_choice;
        }

        function width_choice_write() {
          try {
            localStorage.setItem(WIDTH_STORAGE_KEY, select.value);
          } catch (storage_error) {}
        }

        function layout() {
          const count = Number(select.value);
          const cell_width = grid.clientWidth / count;
          const scale = cell_width / data.width;
          const cell_height = data.height * scale;
          for (const cell of grid.querySelectorAll(".cell-")) {
            cell.style.height = cell_height + "px";
            cell.firstChild.style.transform = "scale(" + scale + ")";
          }
        }

        function build() {
          const count = Number(select.value);
          const table = document.createElement("table");
          let row = null;
          data.pages.forEach(function (page, index) {
            if (index % count === 0) {
              row = table.insertRow();
            }
            const cell = row.insertCell();
            cell.style.width = 100 / count + "%";
            const box = document.createElement("div");
            box.className = "cell-";
            const frame = document.createElement("iframe");
            frame.src = page.href;
            frame.width = data.width;
            frame.height = data.height;
            const link = document.createElement("a");
            link.href = page.href;
            link.setAttribute("aria-label", page.name);
            box.appendChild(frame);
            box.appendChild(link);
            cell.appendChild(box);
          });
          while (row.cells.length < count) {
            row.insertCell();
          }
          grid.replaceChildren(table);
          layout();
        }

        select.addEventListener("change", function () {
          width_choice_write();
          build();
        });
        new ResizeObserver(layout).observe(grid);
        build();
      })();
    </script>
  </body>
</html>
